<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💕 DANA 💕</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff9fc2,
                #ffd6e7,
                #ffb6d5
            );
        }

        /* TARJETA */

        .perfil {
            width: 320px;
            padding: 30px;
            text-align: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 120, 170, 0.35) 8px,
                    transparent 9px
                ),
                radial-gradient(
                    circle at 80% 30%,
                    rgba(255, 80, 140, 0.3) 7px,
                    transparent 8px
                ),
                radial-gradient(
                    circle at 30% 80%,
                    rgba(255, 160, 200, 0.4) 9px,
                    transparent 10px
                ),
                linear-gradient(
                    135deg,
                    #fff0f6,
                    #ffc9df,
                    #ffe6f0
                );

            background-size: 80px 80px;

            border-radius: 30px;

            border: 4px solid #ff6f9f;

            box-shadow:
                0 10px 35px rgba(190, 40, 100, 0.4),
                0 0 25px rgba(255, 100, 160, 0.5);
        }

        /* DECORACIÓN */

        .decoracion {
            font-size: 27px;
            margin-bottom: 15px;
        }

        /* FOTO */

        #avatar {
            width: 150px;
            height: 150px;

            object-fit: cover;

            border-radius: 50%;

            border: 6px solid #ff5c93;

            box-shadow:
                0 0 15px #ff80ab,
                0 0 30px #ffb6d5;
        }

        /* NOMBRE */

        h1 {
            color: #d81b60;
            font-size: 32px;
            margin-bottom: 10px;

            text-shadow:
                2px 2px 5px #ffb6d5;
        }

        /* FRASE */

        p {
            color: #9c315d;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.6;
        }

        /* BOTONES */

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .boton-enlace {
            padding: 14px;

            text-decoration: none;

            color: white;

            background: linear-gradient(
                90deg,
                #ff4f91,
                #d81b60
            );

            border-radius: 25px;

            font-weight: bold;

            box-shadow:
                0 5px 12px rgba(216, 27, 96, 0.3);

            transition: 0.3s;
        }

        .boton-enlace:hover {
            transform: scale(1.07);

            box-shadow:
                0 8px 18px rgba(216, 27, 96, 0.4);
        }

        /* MENSAJE */

        .mensaje {
            margin-top: 25px;

            padding: 15px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.65);

            color: #a51d50;

            font-weight: bold;

            line-height: 1.7;

            border: 2px solid #ff9fc2;
        }

        /* CORAZONES */

        .corazones {
            font-size: 25px;
            margin-top: 20px;

            animation: latido 1.5s infinite;
        }

        @keyframes latido {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>

<body>

    <main class="perfil">

        <!-- DECORACIÓN -->

        <div class="decoracion">
            ✨🌹💕🌹✨
        </div>

        <!-- FOTO -->

        <img
            id="avatar"
            src="Gaby.jpeg"
            alt="Mi foto"
            title="Foto de perfil DANA"
        >

        <!-- NOMBRE -->

        <h1>
            💕 DANA ❤️‍🔥
        </h1>

        <!-- FRASE -->

        <p>
            Mi lugar favorito es contigo 💗
            <br>
            Eres mi vida ❤️
        </p>

        <!-- BOTONES -->

        <div class="links">

            <a href="#" class="boton-enlace">
                💖 Mi persona favorita
            </a>

            <a href="#" class="boton-enlace">
                🌹 Siempre contigo
            </a>

            <a href="#" class="boton-enlace">
                💌 Mi amor bonito
            </a>

        </div>

        <!-- MENSAJE -->

        <div class="mensaje">

            ❤️ Gracias por ser parte de mi vida ❤️

            <br>

            ✨ Contigo todo es más bonito ✨

            <br>

            💕 Te llevo siempre en mi corazón 💕

        </div>

        <!-- DECORACIÓN FINAL -->

        <div class="corazones">
            💕 💗 💖 ❤️ 💖 💗 💕
        </div>

    </main>

</body>

</html>
